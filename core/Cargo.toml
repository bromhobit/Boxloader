[package]
name = "dopamine-loader-core"
version = "0.2.0"
edition = "2024"

[dependencies]
apple-codesign-quick = "=0.1.0"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "afc", "house_arrest", "installation_proxy", "misagent"] }
isideload = { version = "=0.5.2", default-features = false, features = ["fs-storage", "tokio-mt", "install"] }
plist = "1.10"
rootcause = "0.12"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zeroize = "1.9"
